services:
  - type: web
    name: cyber-threat-detector-api
    env: python
    region: oregon
    # Install deps then build DL checkpoints so /predict-batch with model_backend=deep works on Render.
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt && python -m src.train_dl --quick
    startCommand: |
      gunicorn src.app.api:app \
        --workers 1 \
        --worker-class uvicorn.workers.UvicornWorker \
        --bind 0.0.0.0:$PORT \
        --timeout 120 \
        --log-level debug \
        --access-logfile - \
        --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: DEBUG
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Set in Render dashboard (Secrets): API_SECRET_KEY, CORS_ORIGINS, RATE_LIMIT_PER_MINUTE
    healthCheckPath: /health
    autoDeploy: true